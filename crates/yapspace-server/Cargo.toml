[package]
name = "yapspace-server"
description = "YapSpace backend: REST API, realtime hub, migrations and admin CLI"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "yapspace_server"
path = "src/lib.rs"

[[bin]]
name = "yapspace"
path = "src/main.rs"

[dependencies]
yapspace-identity = { path = "../yapspace-identity" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "request-id", "timeout", "limit", "compression-gzip", "compression-br", "catch-panic", "util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
argon2 = "0.6"
rand = "0.10"
sha2 = "0.10"
base64 = "0.22"
governor = "0.10"
dashmap = "6"
moka = { version = "0.12", features = ["sync"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
utoipa = { version = "6", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
ipnet = "2"
unicode-normalization = "0.1"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio-tungstenite = "0.30"

[lints]
workspace = true
