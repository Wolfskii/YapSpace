[package]
name = "yapspace-identity"
description = "Pure URL identity rules for YapSpace (normalization, site adapters, identity keys)"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
url = "2"
psl = "2"
sha2 = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
proptest = "1"
pretty_assertions = "1"

[lints]
workspace = true
